<ion-header [translucent]="true">
  <ion-toolbar>
    @if(avatarUrl){
    <ion-buttons slot="start">
      <ion-avatar class="chat-avatar">
        <ion-img [src]="avatarUrl" alt="avatar" />
      </ion-avatar>
    </ion-buttons>
    }
    <ion-title> {{title}} </ion-title>

    @if (showRightButton){

    <ion-buttons slot="end">
      <ion-button fill="clear" (click)="rigthClick.emit()">
        <ion-icon slot="icon-only" [name]="rightIcon"></ion-icon>
      </ion-button>
    </ion-buttons>
    }
  </ion-toolbar>
</ion-header>
