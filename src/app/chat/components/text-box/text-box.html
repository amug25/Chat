<ion-toolbar style="--min-height: 72px">
  <div class="px-3 py-2 flex items-center gap-1">
    <input
      type="text"
      placeholder="Mensaje"
      [formControl]="messageControl"
      (keydown.enter)="onSend()"
      class="input input-bordered flex-1 h-14 placeholder-gray-500"
    />
    <button
      (click)="onSend()"
      [disabled]="!messageControl.valid"
      class="btn w-14 h-14 min-h-14"
    >
      <svg
        xmlns="http://www.w3.org/2000/svg"
        width="24"
        height="24"
        viewBox="0 0 24 24"
      >
        <path
          fill="currentColor"
          fill-opacity="0.25"
          stroke="currentColor"
          stroke-width="1.2"
          d="m6.998 10.247l.435.76c.277.485.415.727.415.993s-.138.508-.415.992l-.435.761c-1.238 2.167-1.857 3.25-1.375 3.788c.483.537 1.627.037 3.913-.963l6.276-2.746c1.795-.785 2.693-1.178 2.693-1.832s-.898-1.047-2.693-1.832L9.536 7.422c-2.286-1-3.43-1.5-3.913-.963s.137 1.62 1.375 3.788Z"
        />
      </svg>
    </button>
  <ion-toast [isOpen]="showToast" [message]="toastMessage" [duration]="1000" position="bottom" (didDismiss)="showToast =false" />
  </div>
</ion-toolbar>
