<app-header
  [title]="headerTitle"
  [avatarUrl]="headerAvatarUrl"
  [showRightButton]="true"
  rightIcon="log-out-outline"
  (rigthClick)="onLogOut()"
></app-header>
<ion-content #content [fullscreen]="true">
  <messages
    (titleChange)="headerTitle = $event"
    (avatarChange)="headerAvatarUrl = $event"
  ></messages>

  @if(showInfinite()){

  <ion-infinite-scroll
    position="top"
    threshold="20px"
    [disabled]="!firstScrollDone || noMoreMessages"
    (ionInfinite)="onIonInfinite($event)"
  >
    <ion-infinite-scroll-content
      loadingText="Cargando mensajes..."
      loadingSpinner="bubbles"
    ></ion-infinite-scroll-content>
  </ion-infinite-scroll>
  }
</ion-content>
<ion-footer>
  <text-box />
</ion-footer>
