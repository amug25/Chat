<app-header
  title="Chat"
  [showRightButton]="true"
  rightIcon="log-out-outline"
  (rigthClick)="onLogOut()"
></app-header>
<ion-content
  #content
  [fullscreen]="true"
  [scrollEvents]="true"
  (ionScroll)="onScroll($event)"
>
  <ion-infinite-scroll
    position="top"
    threshold="80px"
    (ionInfinite)="onIonInfinite($event)"
  >
    <ion-infinite-scroll-content
      loadingText="Cargando mensajes..."
      loadingSpinner="bubbles"
    ></ion-infinite-scroll-content>
  </ion-infinite-scroll>
  <messages></messages>
</ion-content>
<ion-footer>
  <text-box />
</ion-footer>
