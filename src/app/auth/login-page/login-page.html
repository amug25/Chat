<ion-content [fullscreen]="true">
  <app-header title="Login Chat"></app-header>
  <div id="container">
    <strong>Accede al mejor chat del mundo</strong>
    <p>¿Ya tienes una cuenta?</p>
    <ion-button
      class="google-button"
      shape="round"
      style="margin-top: 5px"
      (click)="signInWithGoogle()"
    >
      <ion-icon
        slot="start"
        name="logo-google"
        style="margin-inline-end: 10px"
      ></ion-icon>
      <span class="google-btn_txt" style="margin-top: 1px">Loguearse</span>
    </ion-button>
  </div>
</ion-content>
