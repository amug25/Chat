<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-title> Chat </ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <ion-header collapse="condense">
    <ion-toolbar>
      <ion-title size="large">Blank</ion-title>
    </ion-toolbar>
  </ion-header>

  <div id="container">
    <strong>Accede al mejor chat del mundo</strong>
    <p>
      ¿Ya tienes una cuenta?

      <!-- <a
        target="_blank"
        rel="noopener noreferrer"
        href="https://ionicframework.com/docs/components"
        >Inicia sesión</a
      > -->
    </p>
    <ion-button
      class="google-button"
      shape="round"
      style="margin-top: 5px"
      (click)="signInWithGoogle()"
    >
      <ion-icon
        slot="start"
        name="logo-google"
        style="margin-inline-end: 10px"
      ></ion-icon>
      <span class="google-btn_txt" style="margin-top: 1px">Loguearse</span>
    </ion-button>
  </div>
</ion-content>
